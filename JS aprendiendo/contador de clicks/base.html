<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body{
      margin: 0;
    }

    html, body {
      min-height: 100%;
    }

    .contenedor-fondo {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Estilos clave para que el vídeo actúe como fondo */
    .video-fondo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Evita que el vídeo se deforme y cubre todo el espacio */
      min-width: 100%;
      min-height: 100%;
      z-index: -1;       /* Envía el vídeo por detrás del texto */
    }

    #numero {
      font-family: monospace;
      text-align: center;
      font-size: 4rem;
    }

    .cookie {
      cursor: pointer;
      display: inline-block;
      will-change: transform;
      transform-origin: center center;
      transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 160ms ease;
      outline: none;
      border: none;
      -webkit-tap-highlight-color: transparent;
      border-radius: 200px;
    }

    .cookie:focus,
    .cookie:active {
      outline: none;
      box-shadow: none;
    }

    .cookie.flotar {
      animation: floatClick 170ms ease-out forwards;
    }

    @keyframes floatClick {
      0% {
        transform: translateY(0) scale(1);
        box-shadow: 0 10px 16px rgba(0, 0, 0, 0.16);
      }
      40% {
        transform: translateY(-22px) scale(1.04);
        box-shadow: 0 18px 26px rgba(0, 0, 0, 0.24);
      }
      100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 12px 18px rgba(0, 0, 0, 0.18);
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button {
      font-size: 2rem;
      padding: 20px;
      text-align: center;
    }

    #puntuacion {
      position: absolute;
      top: 200px;
      left: 300px;
      font-size: 3rem;
      font-weight: bold;
      font-family: monospace;
      -webkit-text-stroke: 2px rgb(255, 0, 85);
      color: azure;
      opacity: 0;
      pointer-events: none; 
      z-index: 10000;
    }

    .animar {
      animation: slide 2s ease-out; 
    }

    @keyframes slide {
      0% {
        transform: translateY(50px);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1; 
      }
      100% {
        transform: translateY(-50px);
        opacity: 0;
      }
    }
  </style>
  <title>Cookie Clicker</title>
</head>
<body>
  <div class="contenedor-fondo">

  <video autoplay muted loop playsinline class="video-fondo">
    <source src="istockphoto-1374018501-640_adpp_is.mp4" type="video/mp4">
  </video>
  <h1 id="numero">0</h1>
  <p id="puntuacion"></p>
  <div class="container">
    <img id="sumar" class="cookie" height="400px" src="cookie.png" alt="Galleta">
      <button id="restar">-1</button>
      <button id="multiplicar">x2</button>
       <button id="sumarCinco">+5</button>
    </div>
  </div>
  
  <script src="contador.js"></script>
</body>
</html>
